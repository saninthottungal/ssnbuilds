name: ssnbuilds
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_gutter: ^2.2.0
  flutter_web_plugins:
    sdk: flutter
  go_router: ^17.0.1
  go_router_builder: ^4.3.0
  responsive_framework: ^1.5.1
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.10.5
  flutter_gen_runner: ^5.12.0
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  fonts:
    - family: jet_brains_mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-VariableFont.ttf
    - family: space_grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-VariableFont.ttf

  assets:
    - assets/icons/
    - assets/images/
    - assets/logo/
